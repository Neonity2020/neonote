<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Notion Clone 应用图标：以字母 N 为主体。
    源文件是矢量；渲染成 PNG 请用 Chromium/Electron（不要用 ImageMagick 的 MSVG，会丢渐变）。
    字体依赖系统无衬线体：macOS 上是 Helvetica Neue Bold，其他平台回落到 Arial Bold。
  -->
  <defs>
    <!-- 底板：深墨色斜向渐变 -->
    <linearGradient id="bg" x1="0.12" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#30303A"/>
      <stop offset="0.45" stop-color="#1A1A20"/>
      <stop offset="1" stop-color="#0A0A0D"/>
    </linearGradient>
    <!-- 左上角高光 -->
    <radialGradient id="sheen" cx="0.24" cy="0.08" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- 字母背后的一团靛蓝雾光 -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C86FF" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#6366F1" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <!-- 字母：白 → 淡靛蓝 -->
    <linearGradient id="mark" x1="0.16" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.58" stop-color="#F4F5FF"/>
      <stop offset="1" stop-color="#C0C8FF"/>
    </linearGradient>
    <filter id="markShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="glowBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <!-- 图标底板 -->
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#sheen)"/>

  <!-- 字母背后的靛蓝雾光 -->
  <ellipse cx="512" cy="512" rx="300" ry="280" fill="url(#glow)" filter="url(#glowBlur)"/>

  <!-- 主体字母 N：字号 620，基线 734，视觉居中 -->
  <text x="512" y="734" text-anchor="middle"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-weight="700" font-size="620"
        fill="url(#mark)" filter="url(#markShadow)">N</text>

  <!-- 内描边：让底板边缘有一点玻璃感 -->
  <rect x="34" y="34" width="956" height="956" rx="218" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="4"/>
</svg>
